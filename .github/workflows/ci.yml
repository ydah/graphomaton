name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.2'
            experimental: false
          - ruby: '3.3'
            experimental: false
          - ruby: '3.4'
            experimental: false
          - ruby: 'head'
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build and install gem
        run: |
          gem build graphomaton.gemspec --output graphomaton.gem
          gem install --local graphomaton.gem --no-document
          graphomaton --version
          graphomaton list formats
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Run test and type suites
        run: bundle exec rake
  renderers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz librsvg2-bin imagemagick plantuml
      - name: Install Mermaid renderer
        run: npm install --global @mermaid-js/mermaid-cli@10.9.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Smoke-test native renderers
        run: |
          printf 'states: [q0, q1]\ninitial: q0\nfinal: [q1]\ntransitions: [[q0, q1, a]]\n' > /tmp/machine.yml
          bundle exec ruby exe/graphomaton /tmp/machine.yml /tmp/machine.dot
          bundle exec ruby exe/graphomaton /tmp/machine.yml /tmp/machine.mmd
          bundle exec ruby exe/graphomaton /tmp/machine.yml /tmp/machine.puml
          dot -Tsvg /tmp/machine.dot -o /tmp/machine-dot.svg
          mmdc -i /tmp/machine.mmd -o /tmp/machine-mermaid.svg
          plantuml -failfast2 -tsvg /tmp/machine.puml
          bundle exec ruby exe/graphomaton /tmp/machine.yml /tmp/machine.png
          bundle exec ruby exe/graphomaton /tmp/machine.yml /tmp/machine.pdf
          bundle exec ruby exe/graphomaton /tmp/machine.yml /tmp/machine.webp
          file /tmp/machine-dot.svg /tmp/machine-mermaid.svg /tmp/machine.svg /tmp/machine.png /tmp/machine.pdf /tmp/machine.webp
